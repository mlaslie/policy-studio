# Policy Studio backend package.
[project]
name = "policy-studio"
version = "0.1.0"
description = "Policy Studio: discover, audit and build Agent Gateway / Agent Registry / Model Armor policies"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "google-auth>=2.30",
  "requests>=2.31",
  "pydantic>=2.7",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["policy_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
